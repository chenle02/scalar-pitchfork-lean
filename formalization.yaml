version: v0.4
project:
  name: scalar-pitchfork-lean
  description: Lean 4 / Mathlib library on the scalar pitchfork bifurcation f(tau,z) = alpha*tau*z - beta*z^3
    + R(tau,z) with a remainder bounded by its jets -- existence, local uniqueness and continuity of the
    two branches, the square-root amplitude law, the stability sign, remainder bounds derived from Taylor
    jets at the origin with a counterexample showing the jets alone do not give the stronger bound --
    and the topological skeleton of the global (Rabinowitz-type) alternatives for a branch of solutions.
  authors:
  - Le Chen
  license: Apache-2.0
sources:
- title: 'Chemotaxis models with signal-dependent sensitivity and a logistic-type source, III: Bifurcation
    and spike-like solutions'
  authors:
  - Le Chen
  - Ian Ruau
  - Wenxian Shen
  id: arXiv:2610.20976
  type: article
  relationship: background
  note: The library was first developed for the Lean companion of this paper and keeps only the general
    mathematics; nothing in it depends on the paper. It does not formalize the paper's theorems.
related_formalizations:
- id: https://github.com/leanprover-community/mathlib4
  relationship: builds-on
  note: pinned in lake-manifest.json
status:
  scope: 'Formalized: the scalar pitchfork normal form with a jet-bounded remainder (branch existence,
    local uniqueness, continuity, square-root amplitude, stability sign, classification of small zeros),
    remainder bounds from Taylor jets and the jet counterexample, and the topological skeleton of global
    branch alternatives (relative closures, one-sided components, unbounded non-compact components). Excluded:
    Crandall-Rabinowitz, Lyapunov-Schmidt and center-manifold reductions (the scalar normal form is the
    starting point), degree theory (the global alternatives are hypotheses), certified root tools, and
    PDE theory.'
