# Claims of scalar-pitchfork-lean (schema claims/1): every public theorem and lemma of the library.
# status: reusable = judged by a comparator configuration (comparator.json, comparator.headline.json);
# experimental = proved in the library and axiom-checked, but not stated in a Challenge.
schema: claims/1
package: scalar-pitchfork-lean
claims:
- id: scalar-pitchfork-lean/deriv-bound-b3
  decl: ScalarPitchfork.DerivBound.b3
  kind: theorem
  summary: 'Under `DerivBound F r M`, the third iterated derivative on the box, evaluated on directions with `∏ ‖m i‖ = 1`, is bounded by `M`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/deriv-bound-b4
  decl: ScalarPitchfork.DerivBound.b4
  kind: theorem
  summary: 'Under `DerivBound F r M`, the fourth iterated derivative on the box, evaluated on directions with `∏ ‖m i‖ = 1`, is bounded by `M`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/global-base-mem-selected-component
  decl: ScalarPitchfork.Global.base_mem_selectedComponent
  kind: theorem
  summary: 'In particular, the bifurcation point belongs to the unilateral component selected by any point of the retained half-branch.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-global-unbounded-of-monotone
  decl: ScalarPitchfork.Global.global_unbounded_of_monotone
  kind: theorem
  summary: 'Global unboundedness of a monotone branch: under the global alternatives, strict monotonicity of the profiles away from the bifurcation point, an orthogonality weight for the complement, and admissibility and precompactness hypotheses, the component is not compact and its parameter supremum is `⊤`.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-is-closed-connected-component-in-of-is-closed
  decl: ScalarPitchfork.Global.isClosed_connectedComponentIn_of_isClosed
  kind: theorem
  summary: 'A connected component inside a closed subset is closed in the ambient space. This is obtained from the closed component in the subtype and the closed subtype inclusion.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-is-closed-of-rel-closed
  decl: ScalarPitchfork.Global.isClosed_of_relClosed
  kind: theorem
  summary: 'A set relatively closed in `V` is closed in the ambient space once its ambient closure stays inside `V`.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: experimental
- id: scalar-pitchfork-lean/global-is-closed-sdiff-of-is-open-preimage
  decl: ScalarPitchfork.Global.isClosed_sdiff_of_isOpen_preimage
  kind: theorem
  summary: 'Removing a set open in the relative topology of a closed parent leaves a set closed in the ambient space.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-is-compact-slice
  decl: ScalarPitchfork.Global.isCompact_slice
  kind: theorem
  summary: 'Bounded-parameter slices are compact. If a closed set `C` lies in the closure of a solution set `S` whose bounded-parameter pieces are relatively compact (the usual a priori bounds plus a compact embedding), then each slice `C ∩ {λ ≤ X}` is compact.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-not-alt-complement
  decl: ScalarPitchfork.Global.not_altComplement
  kind: theorem
  summary: 'Alternative (3) fails for a strictly monotone branch: if a weight `φ` pairs positively with every continuous strictly decreasing profile on `[0, L]` and is orthogonal to `W`, no point `(λ, u* + w)` with `w ∈ W \ {0}` lies in the component.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-not-alt-other-trivial
  decl: ScalarPitchfork.Global.not_altOtherTrivial
  kind: theorem
  summary: 'Alternative (2) fails for a strictly monotone branch: the constant profile `u*` is not strictly monotone.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-not-is-compact-of-alternatives
  decl: ScalarPitchfork.Global.not_isCompact_of_alternatives
  kind: theorem
  summary: 'Alternative elimination: if alternatives (2) and (3) fail, the component is not compact.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-parent-component-is-closed
  decl: ScalarPitchfork.Global.parentComponent_isClosed
  kind: theorem
  summary: 'The parent component is closed once the set of nontrivial solutions is closed.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-retained-with-base-subset-parent-component
  decl: ScalarPitchfork.Global.retainedWithBase_subset_parentComponent
  kind: theorem
  summary: 'A connected retained half-branch together with the bifurcation point lies in the parent component when it lies in the solution set.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-retained-with-base-subset-selected-component
  decl: ScalarPitchfork.Global.retainedWithBase_subset_selectedComponent
  kind: theorem
  summary: 'The connected retained local half-branch selects a single component of the remainder: both the punctured half-branch and its limiting base point belong to the selected component.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-retained-with-base-subset-unilateral-remainder
  decl: ScalarPitchfork.Global.retainedWithBase_subset_unilateralRemainder
  kind: theorem
  summary: 'If the retained local half-branch and the base point avoid the removed opposite half-branch, they lie in the unilateral remainder.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-s-sup-eq-top-of-unbounded
  decl: ScalarPitchfork.Global.sSup_eq_top_of_unbounded
  kind: theorem
  summary: 'Unbounded parameter written as `sup {λ : (λ, u) ∈ C} = +∞`, with the supremum taken in the extended reals.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: experimental
- id: scalar-pitchfork-lean/global-s-sup-param-eq-top
  decl: ScalarPitchfork.Global.sSup_param_eq_top
  kind: theorem
  summary: 'A non-compact component, relatively closed in an admissible set `V` with `closure S ⊆ V` and with relatively compact bounded-parameter pieces of the solution set `S`, has unbounded parameter: `sup λ = +∞` in `EReal`.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-selected-component-is-closed
  decl: ScalarPitchfork.Global.selectedComponent_isClosed
  kind: theorem
  summary: 'The unilateral component is closed. Beyond closedness of the solution set, the only input is relative openness of the removed opposite half-branch in the parent component.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-selected-component-subset-solution-closure
  decl: ScalarPitchfork.Global.selectedComponent_subset_solutionClosure
  kind: theorem
  summary: 'The unilateral component lies inside the solution set.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/global-selected-image-properties
  decl: ScalarPitchfork.Global.selectedImage_properties
  kind: theorem
  summary: 'The unilateral component built inside the admissible subtype `V` is, after inclusion into `ℝ × E`, relatively closed in `V`, contained in `V`, contained in the ambient closure of `S`, and preconnected.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: experimental
- id: scalar-pitchfork-lean/global-strict-anti-on-of-rel-clopen
  decl: ScalarPitchfork.Global.strictAntiOn_of_relClopen
  kind: theorem
  summary: 'Strict decrease propagates along a component: if the decreasing locus is relatively clopen in a preconnected component through the bifurcation point, every other point of the component has a strictly decreasing profile.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-strict-mono-on-of-rel-clopen
  decl: ScalarPitchfork.Global.strictMonoOn_of_relClopen
  kind: theorem
  summary: 'Strict increase propagates along a component: the increasing analogue of `strictAntiOn_of_relClopen`.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: experimental
- id: scalar-pitchfork-lean/global-subset-of-rel-clopen
  decl: ScalarPitchfork.Global.subset_of_relClopen
  kind: theorem
  summary: 'Connectedness propagation: a property holding at the bifurcation point whose locus is relatively open and closed in a preconnected component holds on the whole component.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: reusable
- id: scalar-pitchfork-lean/global-unbounded-of-not-is-compact
  decl: ScalarPitchfork.Global.unbounded_of_not_isCompact
  kind: theorem
  summary: 'Unbounded parameter from non-compactness: if every bounded-parameter slice is compact, a non-compact set has unbounded parameter.'
  keywords: [global-bifurcation, rabinowitz-alternative, compactness, monotone-profile]
  file: ScalarPitchfork/Global/Alternatives.lean
  status: experimental
- id: scalar-pitchfork-lean/global-unilateral-remainder-is-closed
  decl: ScalarPitchfork.Global.unilateralRemainder_isClosed
  kind: theorem
  summary: 'If the opposite half-branch is open in the relative topology of the parent component (an input from the local bifurcation analysis), the unilateral remainder is closed.'
  keywords: [global-bifurcation, connected-component, closedness]
  file: ScalarPitchfork/Global/ComponentClosure.lean
  status: reusable
- id: scalar-pitchfork-lean/pitchfork-jet-exists-bound
  decl: ScalarPitchfork.PitchforkJet.exists_bound
  kind: theorem
  summary: 'Uniform bounds on the third and fourth derivatives on the closed box.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/pitchfork-jet-has-deriv-at-s
  decl: ScalarPitchfork.PitchforkJet.hasDerivAt_s
  kind: theorem
  summary: 'Derivative in `z` of a directional iterated derivative at `(e, t)`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/pitchfork-jet-has-deriv-at-tau
  decl: ScalarPitchfork.PitchforkJet.hasDerivAt_tau
  kind: theorem
  summary: 'Derivative in the parameter of a directional iterated derivative at `(t, 0)`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/pitchfork-jet-mem-u
  decl: ScalarPitchfork.PitchforkJet.mem_U
  kind: theorem
  summary: 'Under `PitchforkJet F U r`, every point `(e, z)` with `|e|, |z| ≤ r` lies in `U`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/pitchfork-jet-zero-le-r
  decl: ScalarPitchfork.PitchforkJet.zero_le_r
  kind: theorem
  summary: 'Under `PitchforkJet F U r`, `|0| ≤ r`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/abs-eq-sgn-mul
  decl: ScalarPitchfork.abs_eq_sgn_mul
  kind: theorem
  summary: 'For a sign `sgn = ±1` with `0 < sgn * u`, `|u| = sgn * u`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/abs-sub-le-of-deriv-bound
  decl: ScalarPitchfork.abs_sub_le_of_deriv_bound
  kind: theorem
  summary: 'One mean value step on the segment `[-|x|, |x|]`.'
  keywords: [pitchfork, taylor-jet, remainder-estimate, iterated-derivative]
  file: ScalarPitchfork/Jet.lean
  status: experimental
- id: scalar-pitchfork-lean/abs-sub-sqrt-le-of-cubic-remainder
  decl: ScalarPitchfork.abs_sub_sqrt_le_of_cubic_remainder
  kind: theorem
  summary: 'A cubic bound `|e| ≤ C |z| ^ 3` on the divided remainder gives a quadratic error for the square-root amplitude: `| |z| - √(alpha * tau / beta) | ≤ C z ^ 2 / |beta|`.'
  keywords: [pitchfork, perturbed-cubic, remainder-estimate, amplitude]
  file: ScalarPitchfork/Perturbed.lean
  status: reusable
- id: scalar-pitchfork-lean/absorbed-const-nonneg
  decl: ScalarPitchfork.absorbedConst_nonneg
  kind: theorem
  summary: 'For `alpha > 0` and `C ≥ 0`, the absorbed constant `absorbedConst alpha beta C = C (ampConst alpha beta C + 1)` is nonnegative.'
  keywords: [pitchfork, existence, intermediate-value, remainder-estimate]
  file: ScalarPitchfork/Existence.lean
  status: experimental
- id: scalar-pitchfork-lean/absorbed-mul-radius
  decl: ScalarPitchfork.absorbed_mul_radius
  kind: theorem
  summary: '`absorbedConst alpha beta C * branchRadius alpha beta C r ≤ |beta| / 4` for `alpha > 0`, `C ≥ 0`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/amp-const-nonneg
  decl: ScalarPitchfork.ampConst_nonneg
  kind: theorem
  summary: 'For `alpha > 0` and `C ≥ 0`, the constant `ampConst alpha beta C = 2 (|beta| + 2C) / alpha` is nonnegative.'
  keywords: [pitchfork, existence, intermediate-value, remainder-estimate]
  file: ScalarPitchfork/Existence.lean
  status: experimental
- id: scalar-pitchfork-lean/amp-err-nonneg
  decl: ScalarPitchfork.ampErr_nonneg
  kind: theorem
  summary: 'For `alpha > 0` and `C ≥ 0`, the amplitude error constant `ampErr alpha beta C` is nonnegative.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/amp-err-le-sqrt
  decl: ScalarPitchfork.amp_err_le_sqrt
  kind: theorem
  summary: 'On the side `tau * beta > 0`, smallness gives `8 * ampErr * |tau| ≤ √(alpha tau / beta)`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/amp-sq-eq-abs
  decl: ScalarPitchfork.amp_sq_eq_abs
  kind: theorem
  summary: 'On the side `tau * beta > 0`, the squared amplitude `alpha * tau / beta` equals `alpha * |tau| / |beta|`.'
  keywords: [pitchfork, existence, intermediate-value, remainder-estimate]
  file: ScalarPitchfork/Existence.lean
  status: experimental
- id: scalar-pitchfork-lean/amplitude-sq-pos
  decl: ScalarPitchfork.amplitude_sq_pos
  kind: theorem
  summary: 'The squared amplitude `alpha * tau / beta` is positive on the side `tau * beta > 0`.'
  keywords: [pitchfork, normal-form, cubic, equilibrium]
  file: ScalarPitchfork/Cubic.lean
  status: experimental
- id: scalar-pitchfork-lean/axis-of-linearization
  decl: ScalarPitchfork.axis_of_linearization
  kind: theorem
  summary: 'The axis condition from the linearization along the axis. If the remainder of `f` satisfies `PitchforkJet` and `∂_z f(tau, 0) = alpha * tau` on the box, then `∂_z R(tau, 0) = 0` on the box; by `strongBounds_of_jet` the stronger bounds follow.'
  keywords: [pitchfork, taylor-jet, counterexample, iterated-derivative]
  file: ScalarPitchfork/JetCounterexample.lean
  status: reusable
- id: scalar-pitchfork-lean/branch-nhd-branch-small
  decl: ScalarPitchfork.branchNhd_branchSmall
  kind: theorem
  summary: 'The strict smallness conditions `BranchNhd` imply the non-strict conditions `BranchSmall` at the same parameter.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-nhd-mem-nhds
  decl: ScalarPitchfork.branchNhd_mem_nhds
  kind: theorem
  summary: 'For `alpha > 0`, `beta ≠ 0`, `C ≥ 0` and `r > 0`, `{tau | BranchNhd alpha beta C r tau}` is a neighbourhood of `0`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-nhd-zero
  decl: ScalarPitchfork.branchNhd_zero
  kind: theorem
  summary: 'For `alpha > 0`, `beta ≠ 0`, `C ≥ 0` and `r > 0`, the parameter `tau = 0` satisfies `BranchNhd`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-radius-le
  decl: ScalarPitchfork.branchRadius_le
  kind: theorem
  summary: 'The window radius `branchRadius alpha beta C r` is at most `r`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-radius-pos
  decl: ScalarPitchfork.branchRadius_pos
  kind: theorem
  summary: 'For `alpha > 0`, `beta ≠ 0`, `C ≥ 0` and `r > 0`, the window radius `branchRadius alpha beta C r` is positive.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-root-exists-unique
  decl: ScalarPitchfork.branchRoot_existsUnique
  kind: theorem
  summary: 'Uniqueness. On the side `tau * beta > 0` there is exactly one zero of each sign in the fixed window `|z| ≤ ρ`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-root-unique
  decl: ScalarPitchfork.branchRoot_unique
  kind: theorem
  summary: 'Uniqueness of the zero of sign `sgn` in the window `0 < sgn * z`, `|z| ≤ ρ`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-small-eventually
  decl: ScalarPitchfork.branchSmall_eventually
  kind: theorem
  summary: 'All smallness conditions hold for every `tau` near `0`; the hypotheses of the branch theorem are therefore not vacuous.'
  keywords: [pitchfork, existence, intermediate-value, remainder-estimate]
  file: ScalarPitchfork/Existence.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-abs-le
  decl: ScalarPitchfork.branch_abs_le
  kind: theorem
  summary: 'The branch functions are bounded by `9/8 * √(alpha tau / beta)` on the whole neighbourhood (and vanish off the side).'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-amplitudes
  decl: ScalarPitchfork.branch_amplitudes
  kind: theorem
  summary: '`± √(alpha * tau / beta)` are zeros of the cubic field on the side `tau * beta > 0`.'
  keywords: [pitchfork, normal-form, cubic, equilibrium]
  file: ScalarPitchfork/Cubic.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-continuous-at-side
  decl: ScalarPitchfork.branch_continuousAt_side
  kind: theorem
  summary: 'Continuity of the branch function at a point on the side `tau * beta > 0`. The only input beyond the value and derivative bounds is `hRcont`: continuity of `tau ↦ R tau z` for each fixed small `z`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-continuous-on
  decl: ScalarPitchfork.branch_continuousOn
  kind: theorem
  summary: 'Continuity: each branch function is continuous on the open neighbourhood `{tau | BranchNhd tau}` of `0`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-curves-of-strong-bound
  decl: ScalarPitchfork.branch_curves_of_strongBound
  kind: theorem
  summary: 'Continuity, the limit at `0` and local uniqueness of the branches from the stronger bounds (`z ^ 2 tau ^ 2` in the value bound, `|z| tau ^ 2` in the derivative bound), through the weak bounds.'
  keywords: [pitchfork, remainder-estimate, strong-bound]
  file: ScalarPitchfork/StrongRemainder.lean
  status: reusable
- id: scalar-pitchfork-lean/branch-eq-of-root
  decl: ScalarPitchfork.branch_eq_of_root
  kind: theorem
  summary: 'A zero of sign `sgn` in the window is the branch value.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-eq-zero-of-not-side
  decl: ScalarPitchfork.branch_eq_zero_of_not_side
  kind: theorem
  summary: 'Off the side `tau * beta > 0` there is no nontrivial small zero, so the branch function is `0` there (in particular at `tau = 0`).'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-eventually-of-strong-bound
  decl: ScalarPitchfork.branch_eventually_of_strongBound
  kind: theorem
  summary: 'The conclusions of `exists_branch_eventually` from the stronger bounds.'
  keywords: [pitchfork, remainder-estimate, strong-bound]
  file: ScalarPitchfork/StrongRemainder.lean
  status: reusable
- id: scalar-pitchfork-lean/branch-root-exists
  decl: ScalarPitchfork.branch_root_exists
  kind: theorem
  summary: 'Existence of the zero of sign `sgn` in the window, with amplitude and derivative sign (from `exists_branch_at`).'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-side-eventually
  decl: ScalarPitchfork.branch_side_eventually
  kind: theorem
  summary: 'Side condition. Near `(tau, z) = (0, 0)` every nontrivial zero of the pitchfork field lies on the side `tau * beta > 0`, and the derivative there has sign opposite to `beta`.'
  keywords: [pitchfork, existence, intermediate-value, remainder-estimate]
  file: ScalarPitchfork/Existence.lean
  status: reusable
- id: scalar-pitchfork-lean/branch-spec
  decl: ScalarPitchfork.branch_spec
  kind: theorem
  summary: 'The branch value is the zero of sign `sgn`, with the amplitude estimate and the derivative sign.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-tendsto-zero
  decl: ScalarPitchfork.branch_tendsto_zero
  kind: theorem
  summary: 'Through the origin: `z^±(tau) → 0` as `tau → 0`.'
  keywords: [pitchfork, branch-curve, local-uniqueness, continuity]
  file: ScalarPitchfork/Branch.lean
  status: experimental
- id: scalar-pitchfork-lean/branch-zero
  decl: ScalarPitchfork.branch_zero
